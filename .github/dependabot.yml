version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Hold new releases for a week: hijacked versions are usually
    # caught and pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # soroban-sdk majors track protocol upgrades and need a redeploy plan.
      - dependency-name: soroban-sdk
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Hold new releases for a week: hijacked versions are usually
    # caught and pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
