name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Test, lint, wasm build
    runs-on: ubuntu-latest
    env:
      # soroban-sdk 28 refuses to build a contract through plain `cargo build`;
      # it requires stellar-cli 25.2.0 or newer.
      STELLAR_CLI_VERSION: 28.1.0
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Install stellar CLI
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin stellar
          stellar --version

      - name: Wasm release build
        run: stellar contract build

      - name: Artifacts exist
        run: |
          test -f target/wasm32v1-none/release/reputation.wasm
          test -f target/wasm32v1-none/release/circle.wasm

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # The deploy script handles secret keys by identity name only; this
      # keeps an accidental `S...` secret out of history.
      - name: Scan full history
        run: gitleaks git --redact --verbose --exit-code 1 .

  advisories:
    name: Cargo advisories
    runs-on: ubuntu-latest
    env:
      CARGO_AUDIT_VERSION: "0.22.2"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-audit-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install cargo-audit
        run: |
          command -v cargo-audit >/dev/null \
            || cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
          cargo audit --version

      # Fails the build on a RustSec vulnerability. Unmaintained-crate
      # warnings (derivative, paste — both pulled in by soroban-sdk) do not:
      # nothing can be done about them until the SDK drops them.
      - name: Audit Cargo.lock
        run: cargo audit
