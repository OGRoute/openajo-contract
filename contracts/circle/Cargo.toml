[package]
name = "circle"
version = "0.2.1"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
ttl-helpers = { path = "../ttl-helpers" }

[dev-dependencies]
proptest = "1"
soroban-sdk = { workspace = true, features = ["testutils"] }
reputation = { path = "../reputation" }
